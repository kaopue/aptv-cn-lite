name: Update APTV CN Lite FINAL

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: aptv-cn-lite-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Build verified live playlist
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import concurrent.futures
          import datetime as dt
          import json
          import re
          import subprocess
          import time
          import urllib.request
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          EPG = "https://live.fanmingming.cn/e.xml"

          # 只使用仍在高频维护/自带验证机制的上游。
          # 不再使用 Guovin 旧 raw output：其项目已明确说明旧 raw output 不再更新。
          SOURCES = [
              ("BestFan-CCTV", 0, "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_cctv_status.m3u8"),
              ("BestFan-Province", 0, "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_province_status.m3u8"),
              ("ChinaIPTV-Domestic", 0, "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV2_GuoNei.m3u8"),
              ("ChinaIPTV-Auto", 1, "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8"),
              ("CS3306", 1, "https://raw.githubusercontent.com/cs3306/IPTV-Sources/main/data/output/iptv_collection.m3u"),
          ]

          CHANNELS = [
              ("CCTV-1 综合", "CCTV-1", "央视频道"),
              ("CCTV-2 财经", "CCTV-2", "央视频道"),
              ("CCTV-3 综艺", "CCTV-3", "央视频道"),
              ("CCTV-4 中文国际", "CCTV-4", "央视频道"),
              ("CCTV-5 体育", "CCTV-5", "央视频道"),
              ("CCTV-5+ 体育赛事", "CCTV-5+", "央视频道"),
              ("CCTV-6 电影", "CCTV-6", "央视频道"),
              ("CCTV-7 国防军事", "CCTV-7", "央视频道"),
              ("CCTV-8 电视剧", "CCTV-8", "央视频道"),
              ("CCTV-9 纪录", "CCTV-9", "央视频道"),
              ("CCTV-10 科教", "CCTV-10", "央视频道"),
              ("CCTV-11 戏曲", "CCTV-11", "央视频道"),
              ("CCTV-12 社会与法", "CCTV-12", "央视频道"),
              ("CCTV-13 新闻", "CCTV-13", "央视频道"),
              ("CCTV-14 少儿", "CCTV-14", "央视频道"),
              ("CCTV-15 音乐", "CCTV-15", "央视频道"),
              ("CCTV-16 奥林匹克", "CCTV-16", "央视频道"),
              ("CCTV-17 农业农村", "CCTV-17", "央视频道"),
              ("北京卫视", "北京卫视", "卫视频道"),
              ("湖南卫视", "湖南卫视", "卫视频道"),
              ("东方卫视", "东方卫视", "卫视频道"),
              ("浙江卫视", "浙江卫视", "卫视频道"),
              ("江苏卫视", "江苏卫视", "卫视频道"),
              ("广东卫视", "广东卫视", "卫视频道"),
              ("深圳卫视", "深圳卫视", "卫视频道"),
              ("河北卫视", "河北卫视", "卫视频道"),
              ("山东卫视", "山东卫视", "卫视频道"),
              ("安徽卫视", "安徽卫视", "卫视频道"),
              ("河南卫视", "河南卫视", "卫视频道"),
              ("湖北卫视", "湖北卫视", "卫视频道"),
              ("天津卫视", "天津卫视", "卫视频道"),
          ]

          IMPORTANT = {
              "CCTV-1 综合", "CCTV-3 综艺", "CCTV-5 体育", "CCTV-5+ 体育赛事",
              "CCTV-6 电影", "CCTV-8 电视剧", "CCTV-13 新闻",
              "北京卫视", "湖南卫视", "东方卫视", "浙江卫视", "江苏卫视",
              "广东卫视", "深圳卫视", "河北卫视"
          }

          CORE_REQUIRED = {"CCTV-1 综合", "CCTV-5 体育", "CCTV-13 新闻"}
          BAD_NAME_HINTS = ("购物", "测试", "轮播", "导视", "预告", "体验", "成人", "音频", "广播")
          MIN_MAIN_CHANNELS = 27
          MAX_CANDIDATES_PER_CHANNEL = 20
          FIRST_STAGE_WORKERS = 28
          FFPROBE_WORKERS = 12

          def fetch_bytes(url, headers=None, timeout=12, limit=None):
              h = {"User-Agent": "Mozilla/5.0 APTV-CN-Lite-Final"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read() if limit is None else r.read(limit)
                  return data, r.geturl(), dict(r.headers)

          def fetch_text(url, headers=None, timeout=12, limit=None):
              data, final_url, resp_headers = fetch_bytes(url, headers, timeout, limit)
              return data.decode("utf-8", "ignore"), final_url, resp_headers

          def attrs_from_extinf(ext):
              return {k.lower(): v for k, v in re.findall(r'([A-Za-z0-9_-]+)="([^"]*)"', ext or "")}

          def parse_declared_latency(attrs):
              raw = attrs.get("response-time", "")
              m = re.search(r"([0-9.]+)\s*ms", raw, re.I)
              if m:
                  return float(m.group(1)) / 1000.0
              m = re.search(r"([0-9.]+)\s*s", raw, re.I)
              if m:
                  return float(m.group(1))
              return 999.0

          def parse_m3u(text, source, source_priority):
              lines = [x.strip() for x in text.splitlines() if x.strip()]
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if not line.startswith("#EXTINF"):
                      i += 1
                      continue
                  ext = line
                  name = ext.split(",", 1)[1].strip() if "," in ext else ""
                  attrs = attrs_from_extinf(ext)
                  url = ""
                  j = i + 1
                  while j < len(lines):
                      if lines[j].startswith("#EXTINF"):
                          break
                      if not lines[j].startswith("#"):
                          url = lines[j].strip()
                          break
                      j += 1
                  if url.startswith(("http://", "https://")):
                      out.append({
                          "name": name,
                          "attrs": attrs,
                          "url": url,
                          "source": source,
                          "source_priority": source_priority,
                          "declared_latency": parse_declared_latency(attrs),
                      })
                  i += 1
              return out

          def source_fresh_enough(source, text):
              # BestFan 状态文件自带 #DATE；超过 72 小时则不用，防止抓到旧缓存。
              if source.startswith("BestFan"):
                  m = re.search(r"^#DATE:\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})", text, re.M)
                  if not m:
                      return False
                  try:
                      stamp = dt.datetime.strptime(m.group(1), "%Y-%m-%d %H:%M:%S")
                      age = dt.datetime.now() - stamp
                      return age.total_seconds() <= 72 * 3600
                  except Exception:
                      return False
              return True

          def clean_identity(s):
              s = (s or "").upper().strip()
              s = re.sub(r"\[[^\]]*\]|\([^\)]*\)", "", s)
              s = re.sub(r"(2160P|1080P|1080I|720P|576P|480P|4K|8K|FHD|UHD|HD|高清|超清|蓝光)", "", s)
              s = re.sub(r"[\s_-]+", "", s)
              return s

          def item_identity(item):
              a = item.get("attrs", {})
              parts = [item.get("name", ""), a.get("tvg-id", ""), a.get("tvg-name", "")]
              return "|".join(clean_identity(x) for x in parts if x)

          def is_radio_or_bad(item):
              a = item.get("attrs", {})
              raw = "|".join([item.get("name", ""), a.get("tvg-name", ""), a.get("group-title", "")])
              if a.get("radio", "").lower() == "true":
                  return True
              return any(x in raw for x in BAD_NAME_HINTS)

          def channel_match(display, item):
              if is_radio_or_bad(item):
                  return False
              ident = item_identity(item)

              if display.startswith("CCTV-"):
                  if display == "CCTV-5+ 体育赛事":
                      return any(x in ident for x in ("CCTV5+", "CCTV5PLUS", "CCTV5P", "体育赛事"))

                  m = re.match(r"CCTV-(\d+)", display)
                  if not m:
                      return False
                  num = m.group(1)

                  # CCTV-5 明确排除 5+ / 5P / PLUS；CCTV-4 排除 CCTV-4K。
                  if display == "CCTV-5 体育" and any(x in ident for x in ("CCTV5+", "CCTV5PLUS", "CCTV5P", "体育赛事")):
                      return False
                  if display == "CCTV-4 中文国际" and "CCTV4K" in ident:
                      return False

                  if re.search(rf"(?:^|\|)CCTV0?{num}(?:$|\|)", ident):
                      return True
                  if f"央视{num}套" in ident:
                      return True
                  return False

              aliases = {
                  "北京卫视": ("北京卫视", "BTV1"),
                  "湖南卫视": ("湖南卫视",),
                  "东方卫视": ("东方卫视", "上海卫视", "东视"),
                  "浙江卫视": ("浙江卫视",),
                  "江苏卫视": ("江苏卫视", "荔枝台"),
                  "广东卫视": ("广东卫视", "GDTV"),
                  "深圳卫视": ("深圳卫视", "SZTV"),
                  "河北卫视": ("河北卫视",),
                  "山东卫视": ("山东卫视",),
                  "安徽卫视": ("安徽卫视",),
                  "河南卫视": ("河南卫视",),
                  "湖北卫视": ("湖北卫视",),
                  "天津卫视": ("天津卫视",),
              }
              return any(clean_identity(x) in ident for x in aliases.get(display, (display,)))

          def request_headers(item):
              a = item.get("attrs", {})
              h = {}
              ua = a.get("http-user-agent") or a.get("user-agent")
              ref = a.get("http-referer") or a.get("http-referrer") or a.get("referer")
              if ua:
                  h["User-Agent"] = ua
              if ref:
                  h["Referer"] = ref
              return h

          def host_of(url):
              try:
                  return (urlparse(url).hostname or "").lower()
              except Exception:
                  return ""

          def choose_master_variant(text, base_url):
              lines = [x.strip() for x in text.splitlines() if x.strip()]
              variants = []
              for i, line in enumerate(lines):
                  if not line.startswith("#EXT-X-STREAM-INF"):
                      continue
                  uri = ""
                  for j in range(i + 1, min(i + 4, len(lines))):
                      if not lines[j].startswith("#"):
                          uri = lines[j]
                          break
                  if not uri:
                      continue
                  bw = 0
                  area = 0
                  mbw = re.search(r"BANDWIDTH=(\d+)", line)
                  if mbw:
                      bw = int(mbw.group(1))
                  mres = re.search(r"RESOLUTION=(\d+)x(\d+)", line)
                  if mres:
                      area = int(mres.group(1)) * int(mres.group(2))
                  variants.append((area, bw, urljoin(base_url, uri)))
              if not variants:
                  return None
              # 直播观看优先 1080p 及以下的最高画质；只有 4K 时才回退 4K。
              within_1080 = [v for v in variants if v[0] and v[0] <= 1920 * 1080]
              pool = within_1080 or variants
              return max(pool, key=lambda x: (x[0], x[1]))[2]

          def resolve_live_media_playlist(item):
              headers = request_headers(item)
              text, effective, _ = fetch_text(item["url"], headers, timeout=6, limit=512 * 1024)
              if "#EXTM3U" not in text:
                  return None

              media_url = effective
              media_text = text
              if "#EXT-X-STREAM-INF" in text:
                  child = choose_master_variant(text, effective)
                  if not child:
                      return None
                  media_text, media_url, _ = fetch_text(child, headers, timeout=6, limit=512 * 1024)
                  if "#EXTM3U" not in media_text:
                      return None
                  if "#EXT-X-STREAM-INF" in media_text:
                      child2 = choose_master_variant(media_text, media_url)
                      if child2:
                          media_text, media_url, _ = fetch_text(child2, headers, timeout=6, limit=512 * 1024)

              # 真正媒体播放列表应包含 EXTINF；ENDLIST 表示点播/录播结束，不作为直播源。
              if "#EXTINF" not in media_text or "#EXT-X-ENDLIST" in media_text:
                  return None

              segments = [x.strip() for x in media_text.splitlines() if x.strip() and not x.strip().startswith("#")]
              if not segments:
                  return None
              segment_url = urljoin(media_url, segments[-1])
              return media_url, media_text, segment_url

          def curl_segment_probe(item, segment_url):
              h = request_headers(item)
              cmd = [
                  "curl", "-L", "--silent", "--show-error",
                  "--connect-timeout", "2.5", "--max-time", "7",
                  "--range", "0-524287", "-o", "/dev/null",
                  "-w", "%{http_code}|%{time_starttransfer}|%{speed_download}|%{size_download}",
              ]
              if h.get("User-Agent"):
                  cmd += ["-A", h["User-Agent"]]
              else:
                  cmd += ["-A", "Mozilla/5.0 APTV-CN-Lite-Final"]
              if h.get("Referer"):
                  cmd += ["-e", h["Referer"]]
              cmd.append(segment_url)
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=9)
                  if p.returncode != 0:
                      return None
                  parts = p.stdout.strip().split("|")
                  if len(parts) != 4:
                      return None
                  code = int(float(parts[0] or 0))
                  ttfb = float(parts[1] or 99)
                  speed = float(parts[2] or 0)
                  size = float(parts[3] or 0)
                  if code not in (200, 206):
                      return None
                  if ttfb > 5.0 or speed < 32 * 1024 or size < 8 * 1024:
                      return None
                  return ttfb, speed, size
              except Exception:
                  return None

          def ffprobe_video(item, media_url):
              h = request_headers(item)
              cmd = [
                  "ffprobe", "-v", "error",
                  "-rw_timeout", "6000000",
                  "-analyzeduration", "1800000",
                  "-probesize", "1500000",
              ]
              if h.get("User-Agent"):
                  cmd += ["-user_agent", h["User-Agent"]]
              extra_headers = []
              if h.get("Referer"):
                  extra_headers.append(f"Referer: {h['Referer']}")
              if extra_headers:
                  cmd += ["-headers", "\\r\\n".join(extra_headers) + "\\r\\n"]
              cmd += [
                  "-show_entries", "stream=codec_type,codec_name,width,height:format=duration",
                  "-of", "json", media_url
              ]
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=10)
                  if p.returncode != 0 or not p.stdout.strip():
                      return None
                  data = json.loads(p.stdout)
                  videos = [s for s in data.get("streams", []) if s.get("codec_type") == "video"]
                  if not videos:
                      return None
                  best = max(videos, key=lambda s: int(s.get("width") or 0) * int(s.get("height") or 0))
                  width = int(best.get("width") or 0)
                  height = int(best.get("height") or 0)
                  if width <= 0 or height < 360:
                      return None
                  return width, height, best.get("codec_name") or ""
              except Exception:
                  return None

          def validate_candidate(item):
              try:
                  resolved = resolve_live_media_playlist(item)
                  if not resolved:
                      return None
                  media_url, _media_text, segment_url = resolved
                  net = curl_segment_probe(item, segment_url)
                  if not net:
                      return None
                  video = ffprobe_video(item, media_url)
                  if not video:
                      return None
                  ttfb, speed, size = net
                  width, height, codec = video
                  x = dict(item)
                  x.update({
                      "media_url": media_url,
                      "segment_url": segment_url,
                      "ttfb": ttfb,
                      "speed": speed,
                      "segment_size": size,
                      "width": width,
                      "height": height,
                      "area": width * height,
                      "codec": codec,
                  })
                  return x
              except Exception:
                  return None

          def quality_penalty(x):
              h = x.get("height", 0)
              if h >= 1080:
                  return 0.0
              if h >= 720:
                  return 0.08
              if h >= 576:
                  return 0.20
              return 0.40

          def rank_score(x):
              # 测的是实际媒体分片，而不是几 KB 的 m3u8 文本。
              # 速度达到约 1.5 MB/s 后收益封顶，避免 GitHub 节点测速偶然值过度影响排序。
              speed_mb = x.get("speed", 0) / (1024 * 1024)
              speed_penalty = max(0.0, 1.5 - min(speed_mb, 1.5)) * 0.35
              return (
                  x.get("source_priority", 2) * 0.10
                  + x.get("ttfb", 9) * 0.70
                  + speed_penalty
                  + quality_penalty(x)
              )

          def select_diverse(rows, limit):
              rows = sorted(rows, key=rank_score)
              selected = []
              used_hosts = set()
              used_sources = set()

              # 首轮优先不同 host，同时尽量不同上游来源。
              for x in rows:
                  h = host_of(x["url"])
                  if h in used_hosts:
                      continue
                  if x["source"] in used_sources and len(rows) > limit:
                      continue
                  selected.append(x)
                  used_hosts.add(h)
                  used_sources.add(x["source"])
                  if len(selected) >= limit:
                      return selected

              # 第二轮只要求 host 不重复。
              for x in rows:
                  if x in selected:
                      continue
                  h = host_of(x["url"])
                  if h in used_hosts:
                      continue
                  selected.append(x)
                  used_hosts.add(h)
                  if len(selected) >= limit:
                      return selected

              # 最后不足才允许同 host。
              for x in rows:
                  if x in selected:
                      continue
                  selected.append(x)
                  if len(selected) >= limit:
                      break
              return selected

          def build_extinf(display, tvg_id, group, item, idx):
              a = item.get("attrs", {})
              shown = display if idx == 0 else f"{display} · 备用{idx}"
              group_name = group if idx == 0 else "备用线路"
              attrs = [
                  f'tvg-id="{tvg_id}"',
                  f'tvg-name="{tvg_id}"',
              ]
              logo = a.get("tvg-logo")
              if logo:
                  attrs.append(f'tvg-logo="{logo}"')
              for key in ("http-user-agent", "http-referer", "http-referrer"):
                  if a.get(key):
                      attrs.append(f'{key}="{a[key]}"')
              attrs.append(f'group-title="{group_name}"')
              return f'#EXTINF:-1 {" ".join(attrs)},{shown}'

          all_items = []
          for source, priority, url in SOURCES:
              try:
                  text, _effective, _headers = fetch_text(url, timeout=20, limit=12 * 1024 * 1024)
                  if not source_fresh_enough(source, text):
                      print(f"[skip stale] {source}")
                      continue
                  items = parse_m3u(text, source, priority)
                  print(f"[source] {source}: {len(items)} items")
                  all_items.extend(items)
              except Exception as e:
                  print(f"[source failed] {source}: {e}")

          # 上一版仅作为额外候选，而且仍必须重新通过本轮 HLS/分片/ffprobe 三重验证。
          prev_path = Path("output/aptv_cn_lite.m3u")
          if prev_path.exists():
              try:
                  prev_items = parse_m3u(prev_path.read_text(encoding="utf-8", errors="ignore"), "Previous", 3)
                  all_items.extend(prev_items)
                  print(f"[source] Previous: {len(prev_items)} items")
              except Exception as e:
                  print(f"[previous ignored] {e}")

          channel_candidates = {}
          for display, tvg_id, group in CHANNELS:
              matches = []
              seen_urls = set()
              for item in all_items:
                  if item["url"] in seen_urls:
                      continue
                  if channel_match(display, item):
                      seen_urls.add(item["url"])
                      x = dict(item)
                      x["display"] = display
                      x["tvg_id"] = tvg_id
                      x["group"] = group
                      matches.append(x)

              matches.sort(key=lambda x: (x["source_priority"], x["declared_latency"], host_of(x["url"])))

              # 先保证 host 多样性，再填满候选，避免 20 条全来自同一服务器。
              pre = []
              hosts = set()
              for x in matches:
                  h = host_of(x["url"])
                  if h and h not in hosts:
                      pre.append(x)
                      hosts.add(h)
                  if len(pre) >= MAX_CANDIDATES_PER_CHANNEL:
                      break
              if len(pre) < MAX_CANDIDATES_PER_CHANNEL:
                  for x in matches:
                      if x in pre:
                          continue
                      pre.append(x)
                      if len(pre) >= MAX_CANDIDATES_PER_CHANNEL:
                          break
              channel_candidates[display] = pre
              print(f"[candidate] {display}: {len(pre)}")

          validated = {display: [] for display, _, _ in CHANNELS}
          jobs = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=FIRST_STAGE_WORKERS) as ex:
              for display, rows in channel_candidates.items():
                  for item in rows:
                      jobs[ex.submit(validate_candidate, item)] = display
              for fut in concurrent.futures.as_completed(jobs):
                  display = jobs[fut]
                  try:
                      x = fut.result()
                  except Exception:
                      x = None
                  if x:
                      validated[display].append(x)

          chosen = {}
          for display, tvg_id, group in CHANNELS:
              rows = validated.get(display, [])
              # 重要台：主线 + 最多 3 条备用；其余：主线 + 1 条备用。
              limit = 4 if display in IMPORTANT else 2
              chosen[display] = select_diverse(rows, limit)

          main_count = sum(1 for display, _, _ in CHANNELS if chosen.get(display))
          missing_core = sorted(x for x in CORE_REQUIRED if not chosen.get(x))
          print(f"[summary] main channels: {main_count}/{len(CHANNELS)}")
          if missing_core:
              print("[fatal] missing core:", ", ".join(missing_core))
          if main_count < MIN_MAIN_CHANNELS or missing_core:
              raise SystemExit("Validation threshold not met; keep previous playlist unchanged")

          lines = [f'#EXTM3U x-tvg-url="{EPG}"']
          report = []
          for display, tvg_id, group in CHANNELS:
              rows = chosen.get(display, [])
              if not rows:
                  report.append(f"{display}: MISSING")
                  continue
              for idx, x in enumerate(rows):
                  lines.append(build_extinf(display, tvg_id, group, x, idx))
                  lines.append(x["url"])
              details = []
              for i, x in enumerate(rows, 1):
                  mbps = x["speed"] * 8 / 1_000_000
                  details.append(
                      f'{i}:{x["source"]} {host_of(x["url"])} '
                      f'{x["width"]}x{x["height"]} ttfb={x["ttfb"]:.2f}s speed={mbps:.1f}Mbps'
                  )
              report.append(f'{display}: ' + " | ".join(details))

          out_dir = Path("output")
          out_dir.mkdir(parents=True, exist_ok=True)
          playlist_tmp = out_dir / "aptv_cn_lite.m3u.tmp"
          report_tmp = out_dir / "line_report.txt.tmp"
          playlist_tmp.write_text("\n".join(lines) + "\n", encoding="utf-8")
          report_tmp.write_text("\n".join(report) + "\n", encoding="utf-8")
          playlist_tmp.replace(out_dir / "aptv_cn_lite.m3u")
          report_tmp.replace(out_dir / "line_report.txt")

          print("===== SELECTED =====")
          print("\n".join(report))
          PYCODE

      - name: Commit verified playlist
        run: |
          git config user.name "aptv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/aptv_cn_lite.m3u output/line_report.txt
          git diff --cached --quiet || git commit -m "Update verified APTV live lines"
          git push
