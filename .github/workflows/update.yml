name: Update APTV CN Lite

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate playlist
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path

          SOURCES = [
              "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u",
              "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8",
          ]
          EPG = "https://live.fanmingming.cn/e.xml"

          WANTED = [
              ("CCTV-1 综合", [r"^CCTV[-_ ]?1(?!\d)", r"央视.*1套"]),
              ("CCTV-2 财经", [r"^CCTV[-_ ]?2(?!\d)", r"央视.*2套"]),
              ("CCTV-3 综艺", [r"^CCTV[-_ ]?3(?!\d)", r"央视.*3套"]),
              ("CCTV-4 中文国际", [r"^CCTV[-_ ]?4(?!\d)", r"央视.*4套"]),
              ("CCTV-5 体育", [r"^CCTV[-_ ]?5(?!\+|\d)", r"央视.*5套(?!\+)"]),
              ("CCTV-5+ 体育赛事", [r"CCTV[-_ ]?5\+", r"CCTV5\+", r"体育赛事"]),
              ("CCTV-6 电影", [r"^CCTV[-_ ]?6(?!\d)", r"央视.*6套"]),
              ("CCTV-7 国防军事", [r"^CCTV[-_ ]?7(?!\d)", r"央视.*7套"]),
              ("CCTV-8 电视剧", [r"^CCTV[-_ ]?8(?!\d)", r"央视.*8套"]),
              ("CCTV-9 纪录", [r"^CCTV[-_ ]?9(?!\d)", r"央视.*9套"]),
              ("CCTV-10 科教", [r"^CCTV[-_ ]?10(?!\d)", r"央视.*10套"]),
              ("CCTV-11 戏曲", [r"^CCTV[-_ ]?11(?!\d)", r"央视.*11套"]),
              ("CCTV-12 社会与法", [r"^CCTV[-_ ]?12(?!\d)", r"央视.*12套"]),
              ("CCTV-13 新闻", [r"^CCTV[-_ ]?13(?!\d)", r"央视.*13套"]),
              ("CCTV-14 少儿", [r"^CCTV[-_ ]?14(?!\d)", r"央视.*14套"]),
              ("CCTV-15 音乐", [r"^CCTV[-_ ]?15(?!\d)", r"央视.*15套"]),
              ("CCTV-16 奥林匹克", [r"^CCTV[-_ ]?16(?!\d)", r"央视.*16套"]),
              ("CCTV-17 农业农村", [r"^CCTV[-_ ]?17(?!\d)", r"央视.*17套"]),
              ("北京卫视", [r"北京卫视"]),
              ("湖南卫视", [r"湖南卫视"]),
              ("东方卫视", [r"东方卫视", r"上海卫视"]),
              ("浙江卫视", [r"浙江卫视"]),
              ("江苏卫视", [r"江苏卫视"]),
              ("广东卫视", [r"广东卫视"]),
              ("深圳卫视", [r"深圳卫视"]),
              ("河北卫视", [r"河北卫视"]),
              ("山东卫视", [r"山东卫视"]),
              ("安徽卫视", [r"安徽卫视"]),
              ("河南卫视", [r"河南卫视"]),
              ("湖北卫视", [r"湖北卫视"]),
              ("天津卫视", [r"天津卫视"]),
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read().decode("utf-8", "ignore")

          def parse(text):
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              out=[]
              for i,line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue
                  name=line.split(",",1)[1].strip() if "," in line else ""
                  url=""
                  for j in range(i+1,min(i+8,len(lines))):
                      if lines[j].startswith("#EXTINF"):
                          break
                      if not lines[j].startswith("#"):
                          url=lines[j]
                          break
                  if url:
                      out.append((name,line,url))
              return out

          pools=[]
          for url in SOURCES:
              try:
                  pools.append(parse(fetch(url)))
              except Exception as e:
                  print("source failed:", url, e)
                  pools.append([])

          bad=re.compile(r"购物|测试|轮播|导视|预告|体验|付费",re.I)

          def pick(patterns):
              for pool in pools:
                  for name,ext,url in pool:
                      if bad.search(name):
                          continue
                      if any(re.search(p,name,re.I) for p in patterns):
                          return ext,url
              return None

          def extinf(display, original):
              attrs=dict(re.findall(r'([\w-]+)="([^"]*)"', original))
              group="央视频道" if display.startswith("CCTV") else "卫视频道"
              tvgid=attrs.get("tvg-id") or display.split()[0]
              tvgname=attrs.get("tvg-name") or display
              logo=attrs.get("tvg-logo","")
              parts=[f'tvg-id="{tvgid}"',f'tvg-name="{tvgname}"']
              if logo:
                  parts.append(f'tvg-logo="{logo}"')
              parts.append(f'group-title="{group}"')
              return f'#EXTINF:-1 {" ".join(parts)},{display}'

          lines=[f'#EXTM3U x-tvg-url="{EPG}"']
          missing=[]
          for display,patterns in WANTED:
              got=pick(patterns)
              if not got:
                  missing.append(display)
                  continue
              ext,url=got
              lines += [extinf(display,ext),url]

          out=Path("output/aptv_cn_lite.m3u")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text("\n".join(lines)+"\n",encoding="utf-8")

          print(f"Generated {(len(lines)-1)//2}/{len(WANTED)} channels")
          if missing:
              print("Missing:", ", ".join(missing))
          PY

      - name: Commit playlist
        run: |
          git config user.name "aptv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/aptv_cn_lite.m3u
          git diff --cached --quiet || git commit -m "Auto update APTV playlist"
          git push
