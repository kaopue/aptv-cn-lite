name: Update APTV CN Lite V2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build and speed-test playlist
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, urllib.request, socket, concurrent.futures, time, os
          from pathlib import Path
          from urllib.parse import urlparse

          EPG = "https://live.fanmingming.cn/e.xml"

          SOURCES = [
              ("Guovin", "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u"),
              ("ChinaIPTV", "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8"),
              ("CS3306", "https://raw.githubusercontent.com/cs3306/IPTV-Sources/main/data/output/iptv_collection.m3u"),
              ("YueChan", "https://raw.githubusercontent.com/YueChan/Live/refs/heads/main/IPTV.m3u"),
              ("CCSH", "https://raw.githubusercontent.com/CCSH/IPTV/main/live.txt"),
              ("BestFan-CCTV", "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_cctv_status.m3u8"),
              ("BestFan-Province", "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_province_status.m3u8"),
          ]

          WANTED = [
              ("CCTV-1 综合", [r"^CCTV[-_ ]?0?1(?!\d)", r"^CCTV1$", r"央视.*1套"]),
              ("CCTV-2 财经", [r"^CCTV[-_ ]?0?2(?!\d)", r"^CCTV2$", r"央视.*2套"]),
              ("CCTV-3 综艺", [r"^CCTV[-_ ]?0?3(?!\d)", r"^CCTV3$", r"央视.*3套"]),
              ("CCTV-4 中文国际", [r"^CCTV[-_ ]?0?4(?!\d)", r"^CCTV4$", r"央视.*4套"]),
              ("CCTV-5 体育", [r"^CCTV[-_ ]?0?5(?!\+|\d)", r"^CCTV5$", r"央视.*5套(?!\+)"]),
              ("CCTV-5+ 体育赛事", [r"CCTV[-_ ]?5\+", r"CCTV5PLUS", r"体育赛事"]),
              ("CCTV-6 电影", [r"^CCTV[-_ ]?0?6(?!\d)", r"^CCTV6$", r"央视.*6套"]),
              ("CCTV-7 国防军事", [r"^CCTV[-_ ]?0?7(?!\d)", r"^CCTV7$", r"央视.*7套"]),
              ("CCTV-8 电视剧", [r"^CCTV[-_ ]?0?8(?!\d)", r"^CCTV8$", r"央视.*8套"]),
              ("CCTV-9 纪录", [r"^CCTV[-_ ]?0?9(?!\d)", r"^CCTV9$", r"央视.*9套"]),
              ("CCTV-10 科教", [r"^CCTV[-_ ]?10(?!\d)", r"央视.*10套"]),
              ("CCTV-11 戏曲", [r"^CCTV[-_ ]?11(?!\d)", r"央视.*11套"]),
              ("CCTV-12 社会与法", [r"^CCTV[-_ ]?12(?!\d)", r"央视.*12套"]),
              ("CCTV-13 新闻", [r"^CCTV[-_ ]?13(?!\d)", r"央视.*13套"]),
              ("CCTV-14 少儿", [r"^CCTV[-_ ]?14(?!\d)", r"央视.*14套"]),
              ("CCTV-15 音乐", [r"^CCTV[-_ ]?15(?!\d)", r"央视.*15套"]),
              ("CCTV-16 奥林匹克", [r"^CCTV[-_ ]?16(?!\d)", r"央视.*16套"]),
              ("CCTV-17 农业农村", [r"^CCTV[-_ ]?17(?!\d)", r"央视.*17套"]),
              ("北京卫视", [r"北京卫视"]),
              ("湖南卫视", [r"湖南卫视"]),
              ("东方卫视", [r"东方卫视", r"上海卫视"]),
              ("浙江卫视", [r"浙江卫视"]),
              ("江苏卫视", [r"江苏卫视"]),
              ("广东卫视", [r"广东卫视"]),
              ("深圳卫视", [r"深圳卫视"]),
              ("河北卫视", [r"河北卫视"]),
              ("山东卫视", [r"山东卫视"]),
              ("安徽卫视", [r"安徽卫视"]),
              ("河南卫视", [r"河南卫视"]),
              ("湖北卫视", [r"湖北卫视"]),
              ("天津卫视", [r"天津卫视"]),
          ]

          IMPORTANT = {
              "CCTV-1 综合","CCTV-2 财经","CCTV-3 综艺","CCTV-4 中文国际",
              "CCTV-5 体育","CCTV-5+ 体育赛事","CCTV-6 电影","CCTV-8 电视剧",
              "CCTV-13 新闻","北京卫视","湖南卫视","东方卫视","浙江卫视",
              "江苏卫视","广东卫视","深圳卫视","河北卫视"
          }

          # 国内网络优先的轻量规则：先偏好国内运营商/电视平台域名，再按实测首包和速率排序。
          DOMESTIC_HINTS = (
              "chinamobile","mobaibox","cmvideo","bestv","cctv","cntv","iptv",
              "telecom","unicom","ltetp","hl.chinamobile","ott.mobaibox"
          )

          BAD_HINTS = ("购物","测试","轮播","导视","预告","体验","付费","成人")

          def fetch(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 APTV-CN-Lite-V2"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "ignore")

          def normalize_name(name):
              s = name.upper().strip()
              s = re.sub(r"\[[^\]]*\]|\([^\)]*\)", "", s)
              s = s.replace("高清","").replace("超清","").replace("蓝光","")
              s = s.replace("频道","").replace("HD","").replace("4K","")
              return re.sub(r"\s+", "", s)

          def parse_m3u(text, source):
              lines = [x.strip() for x in text.splitlines() if x.strip()]
              out = []
              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue
                  name = line.split(",", 1)[1].strip() if "," in line else ""
                  url = ""
                  for j in range(i+1, min(i+8, len(lines))):
                      if lines[j].startswith("#EXTINF"):
                          break
                      if not lines[j].startswith("#"):
                          url = lines[j].strip()
                          break
                  if url.startswith(("http://","https://")):
                      out.append((name, line, url, source))
              return out

          def parse_txt(text, source):
              out = []
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "#genre#" in line:
                      continue
                  if "," not in line:
                      continue
                  name, url = line.split(",", 1)
                  name, url = name.strip(), url.strip()
                  if url.startswith(("http://","https://")):
                      out.append((name, "", url, source))
              return out

          def matches(name, patterns):
              n = normalize_name(name)
              raw = name.strip()
              if any(b in raw for b in BAD_HINTS):
                  return False
              for p in patterns:
                  if re.search(p, raw, re.I) or re.search(p, n, re.I):
                      return True
              return False

          def url_host(url):
              try:
                  return (urlparse(url).hostname or "").lower()
              except:
                  return ""

          def domestic_score(url):
              h = url_host(url)
              return 0 if any(x in h for x in DOMESTIC_HINTS) else 1

          def curl_probe(url):
              cmd = [
                  "curl","-L","--silent","--show-error",
                  "--connect-timeout","2.5","--max-time","6",
                  "--range","0-131071",
                  "-A","Mozilla/5.0 APTV-CN-Lite-V2",
                  "-o","/dev/null",
                  "-w","%{http_code}|%{time_starttransfer}|%{speed_download}|%{url_effective}",
                  url
              ]
              t0 = time.time()
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=8)
                  if p.returncode != 0:
                      return None
                  parts = p.stdout.strip().split("|",3)
                  if len(parts) != 4:
                      return None
                  code = int(parts[0] or 0)
                  ttfb = float(parts[1] or 99)
                  speed = float(parts[2] or 0)
                  eff = parts[3].strip() or url
                  if code not in (200,206) or ttfb > 5.5:
                      return None
                  return {"url":url,"effective":eff,"ttfb":ttfb,"speed":speed,"code":code,"probe_time":time.time()-t0}
              except:
                  return None

          def ffprobe_ok(url):
              cmd = [
                  "ffprobe","-v","error",
                  "-rw_timeout","5000000",
                  "-analyzeduration","1500000",
                  "-probesize","1000000",
                  "-select_streams","v:0",
                  "-show_entries","stream=codec_name,width,height",
                  "-of","csv=p=0",
                  url
              ]
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=8)
                  txt = p.stdout.strip()
                  if p.returncode == 0 and txt:
                      nums = re.findall(r"\d+", txt)
                      area = 0
                      if len(nums) >= 2:
                          try:
                              area = int(nums[-2]) * int(nums[-1])
                          except:
                              area = 0
                      return True, area, txt
              except:
                  pass
              return False, 0, ""

          # 读上一次结果，防止某个上游临时抽风时把历史好线路完全丢掉
          previous = []
          prev_path = Path("output/aptv_cn_lite.m3u")
          if prev_path.exists():
              try:
                  previous = parse_m3u(prev_path.read_text(encoding="utf-8", errors="ignore"), "Previous")
              except:
                  pass

          all_items = list(previous)

          for label, url in SOURCES:
              try:
                  txt = fetch(url)
                  if "#EXTINF" in txt:
                      items = parse_m3u(txt, label)
                  else:
                      items = parse_txt(txt, label)
                  print(f"[source] {label}: {len(items)}")
                  all_items.extend(items)
              except Exception as e:
                  print(f"[source failed] {label}: {e}")

          # 每个目标频道先收集候选
          candidates = {}
          for display, patterns in WANTED:
              rows = []
              seen = set()
              for name, ext, url, source in all_items:
                  if url in seen:
                      continue
                  if matches(name, patterns):
                      seen.add(url)
                      rows.append({
                          "display":display,
                          "name":name,
                          "ext":ext,
                          "url":url,
                          "source":source
                      })
              # 避免候选过多拖垮 Actions：每源适度截断，保留总计前 28 条
              candidates[display] = rows[:28]
              print(f"[candidate] {display}: {len(candidates[display])}")

          # 第一轮：并发 curl 检查，剔除超时/死链
          flat = []
          for display, rows in candidates.items():
              for row in rows:
                  flat.append((display,row))

          probed = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              futs = {ex.submit(curl_probe,row["url"]):(display,row) for display,row in flat}
              for fut in concurrent.futures.as_completed(futs):
                  display,row = futs[fut]
                  r = fut.result()
                  if r:
                      x = dict(row)
                      x.update(r)
                      probed.setdefault(display,[]).append(x)

          # 先按“国内优先 + 首包 + 下载速率”取每台前 6 条进入 ffprobe
          for display in list(probed):
              probed[display].sort(key=lambda x: (
                  domestic_score(x["url"]),
                  x["ttfb"],
                  -x["speed"]
              ))
              probed[display] = probed[display][:6]

          # 第二轮：ffprobe 真正尝试读出视频流
          validated = {}
          jobs = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=14) as ex:
              for display, rows in probed.items():
                  for row in rows:
                      jobs.append((display,row,ex.submit(ffprobe_ok,row["url"])))
              for display,row,fut in jobs:
                  ok, area, info = fut.result()
                  if ok:
                      x = dict(row)
                      x["area"] = area
                      x["ffinfo"] = info
                      validated.setdefault(display,[]).append(x)

          # 最终排序：国内优先；在可播前提下先首包，再分辨率，再速率
          chosen = {}
          for display, rows in validated.items():
              rows.sort(key=lambda x: (
                  domestic_score(x["url"]),
                  x["ttfb"],
                  -x["area"],
                  -x["speed"]
              ))

              limit = 3 if display in IMPORTANT else 2

              selected = []
              used_hosts = set()

              # 第一遍优先不同 host，提升真正的容灾能力
              for x in rows:
                  h = url_host(x["url"])
                  if h and h in used_hosts:
                      continue
                  selected.append(x)
                  if h:
                      used_hosts.add(h)
                  if len(selected) >= limit:
                      break

              # 不够时再补同 host 的高分线路
              if len(selected) < limit:
                  for x in rows:
                      if x in selected:
                          continue
                      selected.append(x)
                      if len(selected) >= limit:
                          break

              chosen[display] = selected

          # 某频道本轮全挂：保留上一版对应线路作为最后兜底
          for display, patterns in WANTED:
              if chosen.get(display):
                  continue
              old = []
              for name, ext, url, source in previous:
                  if matches(name, patterns):
                      old.append({
                          "display":display,"name":name,"ext":ext,"url":url,"source":"Previous",
                          "ttfb":99,"speed":0,"area":0
                      })
              if old:
                  chosen[display] = old[:1]
                  print(f"[fallback previous] {display}")

          def base_tvg_id(display):
              if display.startswith("CCTV"):
                  return display.split()[0]
              return display

          def logo_from_ext(ext):
              m = re.search(r'tvg-logo="([^"]+)"', ext or "")
              return m.group(1) if m else ""

          out = [f'#EXTM3U x-tvg-url="{EPG}"']
          report = []

          for display, _patterns in WANTED:
              rows = chosen.get(display, [])
              if not rows:
                  report.append(f"{display}: 0")
                  continue

              for idx, x in enumerate(rows):
                  if idx == 0:
                      shown = display
                      group = "央视频道" if display.startswith("CCTV") else "卫视频道"
                  else:
                      shown = f"{display} · 备用{idx}"
                      group = "备用线路"

                  tvgid = base_tvg_id(display)
                  logo = logo_from_ext(x.get("ext",""))
                  attrs = [
                      f'tvg-id="{tvgid}"',
                      f'tvg-name="{tvgid}"',
                      f'group-title="{group}"'
                  ]
                  if logo:
                      attrs.insert(2, f'tvg-logo="{logo}"')

                  out.append(f'#EXTINF:-1 {" ".join(attrs)},{shown}')
                  out.append(x["url"])

              details = ", ".join(
                  f'{i+1}:{url_host(x["url"])} {x.get("ttfb",99):.2f}s'
                  for i,x in enumerate(rows)
              )
              report.append(f"{display}: {details}")

          Path("output").mkdir(parents=True, exist_ok=True)
          Path("output/aptv_cn_lite.m3u").write_text("\n".join(out)+"\n", encoding="utf-8")
          Path("output/line_report.txt").write_text("\n".join(report)+"\n", encoding="utf-8")

          print("\n===== RESULT =====")
          print("\n".join(report))
          print(f"\nM3U entries: {(len(out)-1)//2}")
          PY

      - name: Commit playlist and report
        run: |
          git config user.name "aptv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/aptv_cn_lite.m3u output/line_report.txt
          git diff --cached --quiet || git commit -m "Auto update fastest APTV lines"
          git push
